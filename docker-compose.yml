version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: onboarding_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: onboarding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: onboarding_app
    restart: always
    ports:
      - "5050:5050"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: onboarding
      SECRET_KEY: "sua_chave_secreta"
      JWT_SECRET_KEY: "sua_chave_jwt"
      LDAP_SERVER: "ldap://10.0.0.1:389"
      LDAP_DOMAIN: "empresa.local"
    depends_on:
      - db

volumes:
  postgres_data: